name: Bot Auto Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Устанавливаем зависимости
        run: |
          python -m pip install --upgrade pip
          pip install pytest aiohttp aiogram openai firebase-admin python-dotenv apscheduler
      - name: Запуск автотестов
        env:
          BOT_TOKEN: "123456789:AAG_fake_token_for_testing_12345"
          AI_API_KEY: "fake_key"
          AI_BASE_URL: "https://fake.url"
        run: |
          pytest test_bot.py -v
